services:
  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - '6379:6379'

    # Health check always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web1:
    build: ./Backend
    container_name: web_instance_1
    hostname: web1
    ports:
      - '3001:5000'
    user: "1000:1000"
    environment:
      - PORT=${PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      
    depends_on:
        redis:
          condition: service_healthy
  
  web2:
    build: ./Backend
    container_name: web_instance_2
    hostname: web2
    ports:
      - '3002:5000'
    user: "1000:1000"
    environment:
      - PORT=${PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      
  nginx:
    build: ./Nginx
    container_name: nginx_balancer
    ports:
      - '80:80'
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy